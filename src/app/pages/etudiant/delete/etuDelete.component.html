<div class="card m-3">
    <h5 class="card-title">Supprimer un étudiant</h5>
    <div class="card-body">
        <p class="card-text">Êtes-vous sûr de vouloir supprimer cet étudiant ?</p>
        <table class="table table-striped">
            <tbody>
                <tr>
                    <th scope="row">Nom</th>
                    <td name="lastName">{{ etudiant?.lastName }}</td>
                </tr>
                <tr>
                    <th scope="row">Prénom</th>
                    <td name="firstName">{{ etudiant?.firstName }}</td>
                </tr>
                <tr>
                    <th scope="row">Email</th>
                    <td name="email">{{ etudiant?.email }}</td>
                </tr>
            </tbody>
        </table>
        <div class="text-center">
            <button class="btn btn-danger" name="deleteEtudiant" (click)="deleteEtudiant()">Supprimer</button>
            <button class="btn btn-secondary" name="goBack" (click)="goBack()">Retour</button>
        </div>
    </div>
</div>
